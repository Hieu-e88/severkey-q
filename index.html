<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIEUNE SYSTEM - XÁC THỰC KEY</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #171f30;
            --border-color: rgba(255, 255, 255, 0.12);
            --primary-color: #6366f1;
            --copy-btn-bg: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .logo-area { text-align: center; margin-bottom: 16px; }
        .logo-title {
            font-size: 20px;
            font-weight: 700;
            color: #a5b4fc;
        }
        .logo-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        .input-group { margin-bottom: 12px; }
        .input-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .custom-input {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary-color); color: #fff; }
        .btn-copy { background: var(--copy-btn-bg); color: #fff; margin-top: 6px; }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-top: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background: var(--success-color);
            border-radius: 50%;
        }

        .key-wrapper {
            width: 100%;
            margin-bottom: 10px;
        }

        .key-info-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            font-family: monospace;
            color: #a5b4fc;
            font-size: 11px;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
        }

        .time-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 8px;
            padding: 8px;
            color: #c7d2fe;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        #error-msg {
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
            min-height: 16px;
            font-weight: 600;
            color: var(--danger-color);
            word-break: break-all;
        }

        .page-step { display: none; }
        .page-step.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-title">DEV: HIEUNE</div>
            <div class="logo-sub">Hệ thống xác thực bản quyền Key VIP</div>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="login-box" class="page-step active">
            <div class="input-group">
                <label class="input-label">MÃ XÁC THỰC / KEY</label>
                <input type="text" id="key-input" class="custom-input" placeholder="Nhập key của bạn..." autocomplete="off">
            </div>
            <button class="btn btn-primary" onclick="login()">Đăng Nhập Ngay</button>
        </div>

        <!-- GIAO DIỆN ACTIVE -->
        <div id="app-content" class="page-step">
            <div style="text-align: center;">
                <div class="status-badge">
                    <span class="status-dot"></span> ĐANG HOẠT ĐỘNG
                </div>
            </div>
            
            <div class="input-label" style="text-align: left;">KEY CỦA BẠN:</div>
            
            <div class="key-wrapper">
                <div class="key-info-box" id="user-key-display">---</div>
            </div>

            <div class="time-box">
                ⏱ <strong>Thời gian:</strong> <span id="time-remaining">Đang tính...</span>
            </div>

            <button class="btn btn-copy" id="copy-btn" onclick="copyKey()">📋 Sao Chép Key</button>
            <button class="btn btn-danger" onclick="logout('Đã đăng xuất!')">Đăng Xuất</button>
        </div>

        <div id="error-msg"></div>
    </div>

    <script>
        // Trỏ đúng vào kho GitHub "severkey-q" để lấy file dữ liệu
        const DATA_SOURCES = [
            "https://cdn.jsdelivr.net/gh/Hieu-e88/severkey-q@main/Maxacthuc.txt",
            "https://raw.githubusercontent.com/Hieu-e88/severkey-q/main/Maxacthuc.txt"
        ];

        let timerInterval = null;
        let activeFullKey = "";

        function setError(text, color = "var(--danger-color)") {
            const el = document.getElementById('error-msg');
            if (el) {
                el.style.color = color;
                el.innerText = text;
            }
        }

        async function fetchGitHubKeys() {
            const timeTag = '?t=' + Date.now();
            for (let baseUrl of DATA_SOURCES) {
                try {
                    const res = await fetch(baseUrl + timeTag, { cache: 'no-store' });
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.trim().length > 0) {
                            return text.replace(/\r/g, '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        }
                    }
                } catch (e) {
                    console.warn("Lỗi tải dữ liệu", e);
                }
            }
            return null;
        }

        async function login() {
            const inputEl = document.getElementById('key-input');
            const inputKey = inputEl ? inputEl.value.trim().toLowerCase() : "";

            setError("⏳ Đang kiểm tra...", "#a5b4fc");

            if (!inputKey) {
                setError("⚠️ Vui lòng nhập Mã/Key!");
                return;
            }

            const rawLines = await fetchGitHubKeys();
            if (!rawLines) {
                setError("❌ Không thể kết nối máy chủ!");
                return;
            }

            processUserKey(inputKey, rawLines);
        }

        function processUserKey(inputKey, rawLines) {
            const keyData = validateKeyStatus(inputKey, rawLines);

            if (keyData.valid) {
                let expireTime = localStorage.getItem('expire_time_' + inputKey);

                if (!expireTime) {
                    const durationMs = keyData.daysAllowed * 24 * 60 * 60 * 1000;
                    expireTime = Date.now() + durationMs;
                    localStorage.setItem('expire_time_' + inputKey, expireTime);
                }

                showAppUI(keyData.displayKey);
                startTimer(parseInt(expireTime));
            } else {
                setError(keyData.message);
            }
        }

        function validateKeyStatus(userKey, rawLines) {
            let foundLine = null;
            let isNotice = false;
            let isExpired = false;
            let noticeMessage = "";

            const target = userKey.trim().toLowerCase();

            for (let rawLine of rawLines) {
                if (!rawLine) continue;
                const lowerLine = rawLine.toLowerCase();
                
                if (lowerLine.startsWith('tb.')) {
                    let parts = lowerLine.substring(3).split('|').map(p => p.trim());
                    if (parts[0] === target) {
                        foundLine = rawLine;
                        isNotice = true;
                        noticeMessage = parts[1] || "Đã bị ngắt kết nối!";
                        break;
                    }
                } else {
                    let parts = rawLine.split('|').map(p => p.trim());
                    let lowerParts = lowerLine.split('|').map(p => p.trim());

                    let codePart = lowerParts[0] || "";
                    let keyPart = lowerParts[1] ? lowerParts[1] : lowerParts[0];

                    let cleanCode = codePart.split('#')[0].split('.keytrial')[0].trim();
                    let cleanKey = keyPart.split('#')[0].split('.keytrial')[0].trim();

                    if (target === codePart || target === keyPart || target === cleanCode || target === cleanKey) {
                        foundLine = rawLine;
                        if (lowerLine.includes('#hết hạn') || lowerLine.includes('#đã sử dụng')) {
                            isExpired = true;
                        }
                        break;
                    }
                }
            }

            if (!foundLine) return { valid: false, message: "❌ Key không tồn tại!" };
            if (isNotice) return { valid: false, message: "⚠️ " + noticeMessage };
            if (isExpired) return { valid: false, message: "⚠️ Key đã hết hạn!" };

            const parts = foundLine.split('|').map(p => p.trim());
            let fullRawKey = parts[1] ? parts[1] : parts[0];
            
            let days = 1;
            const match = fullRawKey.match(/(\d+)d/i) || fullRawKey.match(/(\d+)n/i);
            if (match) days = parseInt(match[1]);

            let displayKey = fullRawKey.split('.keytrial.')[0].split('#')[0].trim();
            return { valid: true, displayKey: displayKey, daysAllowed: days };
        }

        function startTimer(expireTime) {
            if (timerInterval) clearInterval(timerInterval);

            function updateDisplay() {
                const diff = expireTime - Date.now();
                if (diff <= 0) {
                    clearInterval(timerInterval);
                    logout("Key đã hết thời gian sử dụng!");
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                let text = (d > 0 ? `${d}d ` : "") + `${h}h ${m}m ${s}s`;
                document.getElementById('time-remaining').innerText = text;
            }

            updateDisplay();
            timerInterval = setInterval(updateDisplay, 1000);
        }

        function copyKey() {
            const copyBtn = document.getElementById('copy-btn');
            if (activeFullKey) {
                navigator.clipboard.writeText(activeFullKey).then(() => {
                    copyBtn.innerText = "✅ Đã Sao Chép!";
                    setTimeout(() => { copyBtn.innerText = "📋 Sao Chép Key"; }, 2000);
                });
            }
        }

        function logout(reason) {
            if (timerInterval) clearInterval(timerInterval);
            
            document.getElementById('app-content').classList.remove('active');
            document.getElementById('login-box').classList.add('active');
            document.getElementById('key-input').value = '';
            if (reason) setError(reason);
        }

        function showAppUI(key) {
            activeFullKey = key;
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('app-content').classList.add('active');
            document.getElementById('user-key-display').innerText = key;
            setError('');
        }
    </script>
</body>
</html>
