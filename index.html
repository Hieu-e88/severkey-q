<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Key</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #171f30; padding: 20px; border-radius: 12px; width: 320px; border: 1px solid rgba(255,255,255,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; box-sizing: border-box; }
        input { background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        button { background: #6366f1; color: #fff; font-weight: bold; cursor: pointer; }
        #msg { text-align: center; font-size: 12px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3>XÁC THỰC BẢN QUYỀN</h3>
        <input type="text" id="kInput" placeholder="Nhập mã hoặc key..." autocomplete="off">
        <button onclick="doLogin()">Đăng Nhập</button>
        <div id="msg"></div>
    </div>

    <script>
        async function doLogin() {
            let val = document.getElementById('kInput').value.trim().toLowerCase();
            let msg = document.getElementById('msg');
            if(!val) { msg.style.color = "red"; msg.innerText = "Vui lòng nhập thông tin!"; return; }
            
            msg.style.color = "#a5b4fc"; msg.innerText = "Đang kiểm tra...";

            try {
                let res = await fetch("https://raw.githubusercontent.com/Hieu-e88/severkey-q/main/Key.txt?t=" + Date.now());
                let text = await res.text();
                let lines = text.split('\n');
                
                let found = false;
                for(let line of lines) {
                    if(!line.trim()) continue;
                    let parts = line.split('|').map(p => p.trim().toLowerCase());
                    let code = parts[0] || "";
                    let keyFull = parts[1] || "";
                    let keyOnly = keyFull.split('#')[0].trim();

                    if(val === code || val === keyFull || val === keyOnly) {
                        found = true;
                        break;
                    }
                }

                if(found) {
                    msg.style.color = "#10b981";
                    msg.innerText = "Đăng nhập thành công!";
                } else {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Key không tồn tại!";
                }
            } catch(e) {
                msg.style.color = "#ef4444";
                msg.innerText = "Lỗi kết nối máy chủ!";
            }
        }
    </script>
</body>
</html>
